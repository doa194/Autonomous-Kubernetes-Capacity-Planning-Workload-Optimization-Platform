# S03 §6.2 PriorityClasses (relative policy, provisional values) — all `preemptionPolicy: Never`.
# Priority is scheduler behaviour only; it is NOT the product criticality class (S01-ADR-005).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: capacity-platform-critical}
value: 100000
preemptionPolicy: Never
description: Governance, observer, executor and data services.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: capacity-platform-standard}
value: 50000
preemptionPolicy: Never
description: Capacity, AI, API, observability and identity.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: lab-critical}
value: 10000
preemptionPolicy: Never
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: lab-standard}
value: 1000
preemptionPolicy: Never
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: lab-flexible}
value: 100
preemptionPolicy: Never
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: lab-opportunistic}
value: 0
preemptionPolicy: Never
---
# ResourceQuota is admission accounting, not physical isolation (S03 §6.1). Values are the
# provisional S03/S04 envelopes; capacity-lab preflight checks them against live allocatable.
apiVersion: v1
kind: ResourceQuota
metadata: {name: demo-budget, namespace: workloads-critical}
spec:
  hard: {requests.cpu: 600m, requests.memory: 768Mi, limits.cpu: "1500m", limits.memory: 1Gi, pods: "6"}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: demo-budget, namespace: workloads-standard}
spec:
  hard: {requests.cpu: 900m, requests.memory: 1280Mi, limits.cpu: "2", limits.memory: 2Gi, pods: "10"}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: demo-budget, namespace: workloads-batch}
spec:
  hard: {requests.cpu: "1", requests.memory: 1280Mi, limits.cpu: "2", limits.memory: 2Gi, pods: "10"}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: experiment-budget, namespace: capacity-experiments}
spec:
  hard: {requests.cpu: 300m, requests.memory: 384Mi, limits.cpu: 900m, limits.memory: 576Mi, pods: "3",
         configmaps: "10", secrets: "10"}
---
# LimitRanges bound Pods but must NOT inject defaults: every workload declares explicit requests
# and limits so hidden defaulting cannot change experiment evidence (S03 §6.1). Kubernetes fills in
# `default`/`defaultRequest` from `max`/`min` for `type: Container` items, so the bounds are
# declared with `type: Pod`, which has no defaulting. (All demo and driver Pods have one container.)
apiVersion: v1
kind: LimitRange
metadata: {name: bounds, namespace: capacity-experiments}
spec:
  limits:
    - type: Pod
      max: {cpu: 500m, memory: 256Mi}
      min: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: LimitRange
metadata: {name: bounds, namespace: workloads-batch}
spec:
  limits:
    - type: Pod
      max: {cpu: "1", memory: 768Mi}
      min: {cpu: 10m, memory: 32Mi}
---
apiVersion: v1
kind: LimitRange
metadata: {name: bounds, namespace: workloads-standard}
spec:
  limits:
    - type: Pod
      max: {cpu: "1", memory: 768Mi}
      min: {cpu: 10m, memory: 32Mi}
---
apiVersion: v1
kind: LimitRange
metadata: {name: bounds, namespace: workloads-critical}
spec:
  limits:
    - type: Pod
      max: {cpu: "1", memory: 768Mi}
      min: {cpu: 10m, memory: 32Mi}
---
# Host safety signal written only by the host watchdog (see rbac.yaml).
apiVersion: v1
kind: ConfigMap
metadata: {name: host-safety, namespace: capacity-system}
data:
  state: unknown
  updatedAt: "1970-01-01T00:00:00+00:00"
