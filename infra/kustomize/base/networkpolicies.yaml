# ------------------------------------------------------------------ database: only schema owners
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-clients, namespace: capacity-data}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-api}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-core}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-ai}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-execution}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-identity}},
           podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}}
      ports: [{protocol: TCP, port: 5432}]
---
# ------------------------------------------------------------------ platform service flows
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-egress, namespace: capacity-api}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: capacity-api}}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-data}},
             podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-core}},
             podSelector: {matchLabels: {app.kubernetes.io/name: capacity-governance}}}]
      ports: [{protocol: TCP, port: 8444}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-ai}},
             podSelector: {matchLabels: {app.kubernetes.io/name: capacity-ai}}}]
      ports: [{protocol: TCP, port: 8443}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-identity}},
             podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}}]
      ports: [{protocol: TCP, port: 8443}]
---
# Prometheus scrapes the API's /metrics; host users arrive through the rendered NodePort rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-metrics-ingress, namespace: capacity-api}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: capacity-api}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-observability}},
               podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}}]
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: core-flows, namespace: capacity-core}
spec:
  podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In,
                                    values: [capacity-observer, capacity-engine, capacity-governance]}]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-observability}},
               podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}}]
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-data}},
             podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-identity}},
             podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}}]
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: governance-from-api, namespace: capacity-core}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: capacity-governance}}
  policyTypes: [Ingress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-api}},
               podSelector: {matchLabels: {app.kubernetes.io/name: capacity-api}}}]
      ports: [{protocol: TCP, port: 8444}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: engine-flows, namespace: capacity-core}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: capacity-engine}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-ai}},
               podSelector: {matchLabels: {app.kubernetes.io/name: capacity-ai}}}]
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-observability}},
             podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}}]
      ports: [{protocol: TCP, port: 9090}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ai-flows, namespace: capacity-ai}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: capacity-ai}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-api}},
               podSelector: {matchLabels: {app.kubernetes.io/name: capacity-api}}},
             {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-observability}},
               podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}}]
      ports: [{protocol: TCP, port: 8443}]
  egress:
    # Explicitly NOT allowed: Kubernetes API, executor, governance writes, demo workloads.
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-data}},
             podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-core}},
             podSelector: {matchLabels: {app.kubernetes.io/name: capacity-engine}}}]
      ports: [{protocol: TCP, port: 8443}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-identity}},
             podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}}]
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: executor-flows, namespace: capacity-execution}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: capacity-executor}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-observability}},
               podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}}]
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-data}},
             podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-observability}},
             podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}}]
      ports: [{protocol: TCP, port: 9090}]
---
# ------------------------------------------------------------------ observability
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus-flows, namespace: capacity-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-core}},
           podSelector: {matchLabels: {app.kubernetes.io/name: capacity-engine}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-execution}},
           podSelector: {matchLabels: {app.kubernetes.io/name: capacity-executor}}}
        - {podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}}
      ports: [{protocol: TCP, port: 9090}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: kube-state-metrics}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to: [{namespaceSelector: {matchLabels: {capacity.lab/demo: "true"}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-api}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-core}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-ai}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-execution}}}
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ksm-flows, namespace: capacity-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: kube-state-metrics}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana-flows, namespace: capacity-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}}]
      ports: [{protocol: TCP, port: 9090}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: keycloak-flows, namespace: capacity-identity}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-api}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-core}}}
        - {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-ai}}}
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: capacity-data}},
             podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
---
