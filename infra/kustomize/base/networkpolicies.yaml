# S03 §5.1 / S07 §7.2 network baseline: default-deny ingress+egress in every managed
# namespace, DNS allowed, then one explicit rule per approved flow. Rules that need live
# addresses (Kubernetes API server, host Ollama gateway, NodePort sources) are rendered by
# `capacity-lab` into network-dynamic.yaml after it discovers the kind node network.
# NetworkPolicy is reachability only; every protected endpoint still authenticates callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: capacity-api}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
